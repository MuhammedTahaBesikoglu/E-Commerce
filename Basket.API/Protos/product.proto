syntax = "proto3";

// Sınıfların Basket servisinde üretileceği namespace
option csharp_namespace = "Basket.API.Protos";

package ProductGrpc;

service ProductProtoService {
  rpc GetProduct (GetProductRequest) returns (ProductModel);
}

message GetProductRequest {
  string id = 1;
}

message ProductModel {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stockQuantity = 4;
}